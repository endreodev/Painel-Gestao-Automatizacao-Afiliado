; ---------------------------------------------------------------------------
; Ajustes do PHP dentro do container.
;
; A imagem oficial sobe sem php.ini nenhum, o que deixa memory_limit em 128M.
; A coleta guarda em memoria varias paginas do Mercado Livre ja renderizadas
; (uma lista de 6 paginas passa de 10 MB de HTML) e o painel monta a tabela
; inteira de produtos antes de imprimir - 128M da aperto nos dois.
; ---------------------------------------------------------------------------
memory_limit = 512M

; sem isto uma pagina lenta do ML derruba o painel no meio da requisicao
max_execution_time = 300
